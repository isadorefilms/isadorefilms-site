<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Isadore Films</title>
<meta name="description" content="Get in touch with Isadore Films, a Los Angeles production company.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header is-light">
  <a href="./" class="logo">
    <span class="word">Isadore <b>Films</b></span>
  </a>
  <nav class="primary">
    <ul>
      <li><a href="./">Home</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="page-head">
  <p class="eyebrow">Say hello</p>
  <h1>Get in touch.</h1>
</section>

<section class="contact-grid">
  <div class="contact-info">
    <div class="item">
      <small>Phone</small>
      <a href="tel:+12135135990">213.513.5990</a>
    </div>
    <div class="item">
      <small>Based in</small>
      <span>Los Angeles, CA</span>
    </div>
  </div>

  <form class="contact-form" action="https://formspree.io/f/xaeyjerq" method="POST">
    <div class="field">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="message">Message *</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <input type="hidden" name="_subject" value="New message from isadorefilms.com">
    <button type="submit">Send</button>
    <p class="form-note">We'll get back to you shortly.</p>
  </form>
</section>

<footer>
  <span>Isadore Films · Los Angeles, CA · Est. 2020</span>
  <span><a href="tel:+12135135990">213.513.5990</a></span>
</footer>

</body>
</html>
